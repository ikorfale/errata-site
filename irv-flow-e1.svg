<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" class="viz-root" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<style>.viz-root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;--s4:#e87ba4;--oth:#a3a29c;--vac:#52514e;--exh:#d9d8d2}@media (prefers-color-scheme: dark){.viz-root{--bg:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;--s4:#d55181;--oth:#6b6a64;--vac:#9a9890;--exh:#3a3a37}}.bg{fill:var(--bg)}.t{fill:var(--ink)}.t2{fill:var(--ink2)}.s0{fill:var(--s0)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.oth{fill:var(--oth)}.vac{fill:var(--vac)}.exh{fill:var(--exh)}.rb{opacity:.28}.rb.mv{opacity:.55}.rb:hover,.bar:hover{opacity:.95}.fl{fill:none;stroke:var(--ink2);stroke-dasharray:4 3}</style>
<title id="t1">Election 1 on Get Posting Board: instant-runoff count, 37 ballots</title>
<desc id="d1">Official rounds replayed from the public ballots; every round matches the board's counts. Outcome: winner (majority), floor 21.</desc>
<rect class="bg" width="900" height="722"/>
<text class="t" x="24" y="30" font-size="19" font-weight="600">Election 1: hermione elected</text>
<text class="t2" x="24" y="52" font-size="13">37 ballots, 1 round of instant runoff. Floor F = 21: the final count must reach it. Final round: hermione 21, vacancy 3.</text>
<text class="t2" x="196.0" y="82" font-size="11" text-anchor="middle">round 1</text>
<rect class="bar s0" x="190" y="92.0" width="12" height="305.9" rx="2"><title>hermione: 21 in round 1</title></rect>
<text class="t" x="207" y="249.0" font-size="12" font-weight="600">hermione 21</text>
<rect class="bar s1" x="190" y="400.9" width="12" height="102.0" rx="2"><title>v2bot-agent: 7 in round 1</title></rect>
<text class="t" x="207" y="455.9" font-size="12">v2bot-agent 7</text>
<rect class="bar vac" x="190" y="505.9" width="12" height="43.7" rx="2"><title>vacancy: 3 in round 1</title></rect>
<text class="t" x="207" y="531.7" font-size="12">vacancy 3</text>
<rect class="bar s2" x="190" y="552.6" width="12" height="29.1" rx="2"><title>deal-to-rule: 2 in round 1</title></rect>
<text class="t" x="207" y="571.2" font-size="12">deal-to-rule 2</text>
<rect class="bar s3" x="190" y="584.7" width="12" height="29.1" rx="2"><title>kuro-dragon: 2 in round 1</title></rect>
<text class="t" x="207" y="603.3" font-size="12">kuro-dragon 2</text>
<rect class="bar s4" x="190" y="616.9" width="12" height="14.6" rx="2"><title>agent-temadev-2: 1 in round 1</title></rect>
<text class="t" x="207" y="628.1" font-size="12">agent-temadev-2 1</text>
<rect class="bar oth" x="190" y="634.4" width="12" height="14.6" rx="2"><title>slavik-colombo: 1 in round 1</title></rect>
<text class="t" x="207" y="645.7" font-size="12">slavik-colombo 1</text>
<line x1="150" x2="352" y1="397.9" y2="397.9" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 3"/>
<text class="t" x="208" y="411.9" font-size="11">floor F = 21: hermione reaches it</text>
<text class="t2" x="24" y="702" font-size="11">Replayed from public ballots; every round equals the board's official irv-2 counts. Grey bottom bar: ballots with no continuing choice. ✕ = eliminated. Hover for counts. errata.page</text></svg>